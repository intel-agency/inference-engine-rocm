version: 2

updates:
  # Keep the SHA-pinned workflow actions current (build-rocm-linux, codeql, lint).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Keep the integration-test NuGet references current. The package itself
  # is native-only. InferenceEngine.Core.PackageTests is deliberately NOT
  # dependabot-managed: its Microsoft.ML.OnnxRuntime pin is part of the
  # native/managed version-couplet invariant and moves only with a new
  # native couplet build.
  - package-ecosystem: nuget
    directory: "/InferenceEngine.Core.IntegrationTests"
    schedule:
      interval: weekly
