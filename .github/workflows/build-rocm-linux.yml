name: Build ROCm Native & Pack

on:
  workflow_dispatch:
  push:
    branches: [development, staging, release]
    paths:
      - "scripts/compile_onnx_rocm_docker.sh"
      - "InferenceEngine.Core/**"
      - "InferenceEngine.Core.IntegrationTests/**"
      - ".github/workflows/build-rocm-linux.yml"

permissions:
  contents: read

# Serialize runs of this workflow on the same ref without cancelling in-flight
# ones (INFO-2): overlapping runs previously raced the artifact-cleanup job
# into deleting artifacts of runs that were still consuming them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-rocm:
    name: Build ROCm Native Libs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      # persist-credentials: false — the workspace is bind-mounted into a
      # root-owned Docker container (LOW-4); nothing in this job uses git.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force

      - name: Set script permissions
        run: chmod +x scripts/compile_onnx_rocm_docker.sh

      - name: Compile Native ROCm Libs (Docker)
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p artifacts
          # ROCm 7.2.1 with MIGraphX EP (ORT v1.24.1)
          # Pinned by digest (linux/amd64 manifest, resolved from Docker Hub on
          # 2026-10-20) so the base image cannot be silently replaced upstream.
          docker run --rm \
            -v "$WORKSPACE":/code \
            -w /code \
            rocm/dev-ubuntu-22.04:7.2.1@sha256:42851dac319afce41cf993e25f95005b7f2cd0a0f6abd32ad8f25cd876ec56df \
            /code/scripts/compile_onnx_rocm_docker.sh

      # The container compiles as root, so bind-mounted artifacts land root-owned;
      # the split/strip steps below rewrite them as the runner user.
      - name: Take ownership of build artifacts
        run: sudo chown -R "$(id -u):$(id -g)" artifacts

      - name: Split debug info and strip
        run: |
          mkdir -p debuginfo
          for so in artifacts/*.so; do
            name="$(basename "$so")"
            bid="$(readelf -n "$so" | grep -oP 'Build ID: \K[0-9a-f]+' | head -1)"
            if [ -z "$bid" ]; then echo "::error::no Build ID on $so"; exit 1; fi
            objcopy --only-keep-debug "$so" "debuginfo/${name}-${bid}.debug"
            objcopy --strip-debug "$so"
            echo "$name: BuildID $bid -> debuginfo/${name}-${bid}.debug"
          done

      # Attest the final native libs and tie them to this workflow run; the
      # provenance statements are published to the repository's attestations.
      - name: Attest build provenance (native libs)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.so

      - name: Upload Native Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-rocm-libs
          path: artifacts/*.so
          retention-days: 2

      - name: Upload Debug Info
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-rocm-debuginfo
          path: debuginfo/*.debug
          retention-days: 2

  pack-nuget:
    name: Pack NuGet with ROCm
    needs: build-rocm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      # persist-credentials: false (LOW-4) — this job only packs; no git usage.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download Native Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-rocm-libs
          path: temp_artifacts

      - name: Inject Native Assets
        run: |
          echo "Injecting ROCm libraries into package structure..."
          TARGET_DIR="InferenceEngine.Core/runtimes/linux-x64/native"
          mkdir -p "$TARGET_DIR"
          cp temp_artifacts/libonnxruntime.so "$TARGET_DIR/"
          cp temp_artifacts/libonnxruntime_providers_shared.so "$TARGET_DIR/"
          cp temp_artifacts/libonnxruntime_providers_migraphx.so "$TARGET_DIR/"
          ls -lh "$TARGET_DIR"

      - name: Compute Package Version
        env:
          VERSION_PREFIX: ${{ vars.VERSION_PREFIX }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          PREFIX="${VERSION_PREFIX}"
          RUN="${RUN_NUMBER}"
          case "${REF_NAME}" in
            development) VERSION="${PREFIX}-dev.${RUN}" ;;
            staging)     VERSION="${PREFIX}-rc.${RUN}" ;;
            release)     VERSION="${PREFIX}.${RUN}" ;;
            *)           VERSION="${PREFIX}-local.${RUN}" ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Computed version: $VERSION"

      - name: Pack NuGet Package
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          echo "Packing version: ${VERSION}"
          dotnet pack InferenceEngine.Core/InferenceEngine.ROCm.Runtime.linux-x64.csproj \
            --configuration Release \
            --output ./nupkg \
            -p:Version="${VERSION}"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./nupkg/*.nupkg

      - name: Upload NuGet Package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package-rocm
          path: ./nupkg/*.nupkg
          retention-days: 30

  validate-native:
    name: Validate Native Libs
    needs: pack-nuget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_ORT_VERSION: "1.24.1"  # Must match ORT_TAG in scripts/compile_onnx_rocm_docker.sh (couplet invariant)

    steps:
      # persist-credentials: false (LOW-4) — tests only; no git usage.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download Native Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-rocm-libs
          path: native-libs

      - name: Build test project
        run: |
          dotnet build InferenceEngine.Core.IntegrationTests/InferenceEngine.Core.IntegrationTests.csproj \
            --configuration Release \
            --runtime linux-x64

      - name: Inject ROCm native libs into test output
        run: |
          OUTPUT_DIR="InferenceEngine.Core.IntegrationTests/bin/Release/net10.0/linux-x64"
          # ORT 1.24.x uses [DllImport("onnxruntime.dll")] on all platforms.
          # On Linux, .NET probes the app output dir first, where NuGet has placed the
          # Windows PE onnxruntime.dll. Override it with our ROCm ELF so the load succeeds.
          cp native-libs/libonnxruntime.so "$OUTPUT_DIR/onnxruntime.dll"
          cp native-libs/libonnxruntime.so "$OUTPUT_DIR/libonnxruntime.so"
          cp native-libs/libonnxruntime_providers_shared.so "$OUTPUT_DIR/libonnxruntime_providers_shared.so"
          # NOTE: do NOT copy libonnxruntime_providers_migraphx.so into the output dir.
          # The on-disk tests (structure/symbols/SONAME) reach it via NATIVE_LIBS_DIR
          # without loading it, keeping the suite independent of host ROCm state.
          # (Its presence in an app dir is harmless — ORT 1.24.x loads providers only
          # when the EP is requested — but the suite never needs it loaded.)
          echo "Native libs injected:"
          ls -lh "$OUTPUT_DIR/onnxruntime.dll" "$OUTPUT_DIR/libonnxruntime.so"

      - name: Run Tier-1 validation tests
        env:
          NATIVE_LIBS_DIR: ${{ github.workspace }}/native-libs
        run: |
          dotnet test InferenceEngine.Core.IntegrationTests/InferenceEngine.Core.IntegrationTests.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --no-build \
            --logger "console;verbosity=normal"

      # Regression gate for the 1.24.1.41 compat bug: the package must be
      # consumable via a REAL NuGet restore (PackageReference), not just by
      # CI-side artifact injection. Consumes the exact nupkg this run packed,
      # from a local folder source, then loads it end-to-end.
      - name: Download NuGet Package (consumer smoke)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package-rocm
          path: ./nupkg-local

      - name: Restore-compatibility smoke (consumer simulation)
        run: |
          set -e
          # Exactly one .nupkg is expected here; ls|head also handles the
          # (never observed) multi-match case deterministically.
          # shellcheck disable=SC2012
          NUPKG="$(ls nupkg-local/*.nupkg | head -1)"
          VERSION="$(basename "$NUPKG" .nupkg | sed 's/^InferenceEngine\.ROCm\.Runtime\.linux-x64\.//')"
          ORT_BASE="${EXPECTED_ORT_VERSION}"
          echo "consumer-smoke: consuming $NUPKG (version $VERSION, couplet $ORT_BASE)"
          mkdir -p consumer-smoke && cd consumer-smoke
          dotnet new console --force -o . >/dev/null
          dotnet add package InferenceEngine.ROCm.Runtime.linux-x64 \
            --version "$VERSION" \
            --source "$PWD/../nupkg-local" >/dev/null
          dotnet add package Microsoft.ML.OnnxRuntime --version "$ORT_BASE" >/dev/null
          cat > Program.cs <<PROG
          using Microsoft.ML.OnnxRuntime;
          var v = OrtEnv.Instance().GetVersionString();
          Console.WriteLine(\$"consumer-smoke: native onnxruntime {v} loaded");
          if (!v.StartsWith("$ORT_BASE")) { Console.WriteLine("consumer-smoke: FAIL version mismatch"); return 1; }
          Console.WriteLine("consumer-smoke: PASS");
          return 0;
          PROG
          dotnet run



  publish-github-packages:
    name: Publish to GitHub Packages
    needs: validate-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download NuGet Package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package-rocm
          path: ./nupkg

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/intel-agency/index.json" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate

  create-release:
    name: Create GitHub Release & Publish to NuGet.org
    needs: validate-native
    if: github.ref_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write  # GitHub OIDC — required for nuget.org trusted publishing

    steps:
      # nuget.org trusted publishing (keyless): exchange this job's GitHub OIDC
      # token for a 1-hour API key, validated against the nuget.org policy
      # "intel-agency-InferenceEngine.ROCm.Runtime.linux-x64"
      # (owner intel-agency / repo inference-engine-rocm / workflow
      # build-rocm-linux.yml / environment release — policy owner: intel-agent).
      # Falls back to the classic NUGET_API_KEY secret if the exchange fails so
      # a policy hiccup can never block a release; remove the fallback once
      # trusted publishing has shipped a few releases.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        continue-on-error: true
        with:
          user: intel-agent

      - name: Resolve push key (OIDC, classic fallback)
        env:
          OIDC_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          CLASSIC_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -n "$OIDC_KEY" ]; then
            echo "Using nuget.org trusted publishing (OIDC short-lived key)"
            echo "NUGET_PUSH_KEY=$OIDC_KEY" >> "$GITHUB_ENV"
          elif [ -n "$CLASSIC_KEY" ]; then
            echo "::warning::OIDC exchange failed — falling back to classic NUGET_API_KEY secret"
            echo "NUGET_PUSH_KEY=$CLASSIC_KEY" >> "$GITHUB_ENV"
          else
            echo "::error::No push credential: OIDC exchange failed and NUGET_API_KEY secret is empty"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download NuGet Package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package-rocm
          path: ./nupkg

      - name: Download Native Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-rocm-libs
          path: ./native-libs

      - name: Download Debug Info
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-rocm-debuginfo
          path: ./debuginfo

      - name: Compute Release Version
        env:
          VERSION_PREFIX: ${{ vars.VERSION_PREFIX }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          PREFIX="${VERSION_PREFIX}"
          RUN="${RUN_NUMBER}"
          VERSION="${PREFIX}.${RUN}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate checksums
        run: |
          # One checksum per released asset (bare filenames so `sha256sum -c`
          # works in a flat download dir): stripped .so, split-DWARF .debug, .nupkg
          cd native-libs
          sha256sum -- *.so > SHA256SUMS.txt
          cd ../debuginfo
          sha256sum -- *.debug >> ../native-libs/SHA256SUMS.txt
          cd ../nupkg
          sha256sum -- *.nupkg >> ../native-libs/SHA256SUMS.txt
          echo "=== SHA256SUMS ==="
          cat ../native-libs/SHA256SUMS.txt

      # Releases in this repo are immutable: re-running this job for the same
      # version (e.g. after fixing a failed push) cannot replace release assets.
      # Deleting the release + tag IS allowed, so drop any stale one for this
      # version and recreate from this run's artifacts (mirrors lib PR #39).
      - name: Remove stale release for this version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        run: gh release delete "v$VERSION" --cleanup-tag --yes || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: "v${{ env.VERSION }}"
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            native-libs/*.so
            native-libs/SHA256SUMS.txt
            debuginfo/*.debug
            nupkg/*.nupkg

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "$NUGET_PUSH_KEY" \
            --skip-duplicate

  cleanup-artifacts:
    # Org Actions-artifact storage runs near its quota; the debug info alone is
    # ~300 MB per run. Release assets (.so, .debug, .nupkg, SHA256SUMS) already
    # live durably on the GitHub Release, so after a run completes its Actions
    # artifacts are debugging conveniences only. Keep just the newest set.
    #
    # INFO-2 race fix: the old implementation deleted same-named artifacts from
    # ALL other runs of this workflow — including in-flight and overlapping
    # ones on other branches. Deletion is now scoped to artifacts of COMPLETED
    # runs of this workflow on THIS branch that started more than 2 hours ago
    # (this run and anything younger is untouched; the workflow-level
    # concurrency group serializes same-branch runs as a second guard).
    # Runs last, after every consumer (pack, validate, publish, create-release).
    name: Prune superseded artifacts (keep latest set)
    needs: [publish-github-packages, create-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete artifacts of older same-branch runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          # Runs started before this timestamp (2h ago) are considered stale;
          # anything younger may still be in flight and is never pruned.
          CUTOFF="$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          echo "pruning artifacts of completed runs on '${BRANCH}' started before ${CUTOFF}"
          # Completed runs of this workflow on this branch, excluding this run
          # and anything started within the last 2 hours. Values are passed via
          # --arg (not shell interpolation and not jq $env — the jq embedded in
          # the runner's gh does not support the $env variable).
          # The jq program is deliberately single-quoted: $cur/$cutoff are jq
          # --arg variables, not shell expansions.
          # shellcheck disable=SC2016
          stale_runs="$(gh api --paginate --method GET \
            "/repos/${REPOSITORY}/actions/workflows/build-rocm-linux.yml/runs" \
            -f branch="${BRANCH}" -f status=completed -f per_page=100 \
            --arg cur "${CURRENT_RUN_ID}" --arg cutoff "${CUTOFF}" \
            --jq '.workflow_runs[]
                  | select(.id != ($cur | tonumber))
                  | select(.created_at < $cutoff)
                  | .id')"
          if [ -z "$stale_runs" ]; then
            echo "no stale runs to prune"
            exit 0
          fi
          for run_id in $stale_runs; do
            for name in native-rocm-libs native-rocm-debuginfo nuget-package-rocm; do
              ids="$(gh api "/repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?name=${name}" \
                --jq '.artifacts[].id' || true)"
              for id in $ids; do
                if gh api -X DELETE "/repos/${REPOSITORY}/actions/artifacts/${id}"; then
                  echo "deleted ${name} artifact ${id} (run ${run_id})"
                else
                  echo "WARN: could not delete ${name} artifact ${id} (continuing)"
                fi
              done
            done
          done
