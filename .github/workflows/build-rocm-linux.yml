name: Build ROCm Native & Pack

on:
  workflow_dispatch:
  push:
    branches: [development, staging, release]
    paths:
      - "scripts/compile_onnx_rocm_docker.sh"
      - "InferenceEngine.Core/**"
      - "InferenceEngine.Core.IntegrationTests/**"
      - ".github/workflows/build-rocm-linux.yml"

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-rocm:
    name: Build ROCm Native Libs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force

      - name: Set script permissions
        run: chmod +x scripts/compile_onnx_rocm_docker.sh

      - name: Compile Native ROCm Libs (Docker)
        run: |
          mkdir -p artifacts
          # ROCm 7.2.1 with MIGraphX EP (ORT v1.24.1)
          docker run --rm \
            -v ${{ github.workspace }}:/code \
            -w /code \
            rocm/dev-ubuntu-22.04:7.2.1 \
            /code/scripts/compile_onnx_rocm_docker.sh

      # The container compiles as root, so bind-mounted artifacts land root-owned;
      # the split/strip steps below rewrite them as the runner user.
      - name: Take ownership of build artifacts
        run: sudo chown -R "$(id -u):$(id -g)" artifacts

      - name: Split debug info and strip
        run: |
          mkdir -p debuginfo
          for so in artifacts/*.so; do
            name="$(basename "$so")"
            bid="$(readelf -n "$so" | grep -oP 'Build ID: \K[0-9a-f]+' | head -1)"
            if [ -z "$bid" ]; then echo "::error::no Build ID on $so"; exit 1; fi
            objcopy --only-keep-debug "$so" "debuginfo/${name}-${bid}.debug"
            objcopy --strip-debug "$so"
            echo "$name: BuildID $bid -> debuginfo/${name}-${bid}.debug"
          done

      - name: Upload Native Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-rocm-libs
          path: artifacts/*.so
          retention-days: 5

      - name: Upload Debug Info
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-rocm-debuginfo
          path: debuginfo/*.debug
          retention-days: 5

  pack-nuget:
    name: Pack NuGet with ROCm
    needs: build-rocm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download Native Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-rocm-libs
          path: temp_artifacts

      - name: Inject Native Assets
        run: |
          echo "Injecting ROCm libraries into package structure..."
          TARGET_DIR="InferenceEngine.Core/runtimes/linux-x64/native"
          mkdir -p "$TARGET_DIR"
          cp temp_artifacts/libonnxruntime.so "$TARGET_DIR/"
          cp temp_artifacts/libonnxruntime_providers_shared.so "$TARGET_DIR/"
          cp temp_artifacts/libonnxruntime_providers_migraphx.so "$TARGET_DIR/"
          ls -lh "$TARGET_DIR"

      - name: Compute Package Version
        run: |
          PREFIX="${{ vars.VERSION_PREFIX }}"
          RUN="${{ github.run_number }}"
          case "${{ github.ref_name }}" in
            development) VERSION="${PREFIX}-dev.${RUN}" ;;
            staging)     VERSION="${PREFIX}-rc.${RUN}" ;;
            release)     VERSION="${PREFIX}.${RUN}" ;;
            *)           VERSION="${PREFIX}-local.${RUN}" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Computed version: $VERSION"

      - name: Pack NuGet Package
        run: |
          echo "Packing version: ${{ env.VERSION }}"
          dotnet pack InferenceEngine.Core/InferenceEngine.ROCm.Runtime.linux-x64.csproj \
            --configuration Release \
            --output ./nupkg \
            -p:Version=${{ env.VERSION }}

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./nupkg/*.nupkg

      - name: Upload NuGet Package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-package-rocm
          path: ./nupkg/*.nupkg
          retention-days: 30

  validate-native:
    name: Validate Native Libs
    needs: pack-nuget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download Native Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-rocm-libs
          path: native-libs

      - name: Build test project
        run: |
          dotnet build InferenceEngine.Core.IntegrationTests/InferenceEngine.Core.IntegrationTests.csproj \
            --configuration Release \
            --runtime linux-x64

      - name: Inject ROCm native libs into test output
        run: |
          OUTPUT_DIR="InferenceEngine.Core.IntegrationTests/bin/Release/net10.0/linux-x64"
          # ORT 1.24.x uses [DllImport("onnxruntime.dll")] on all platforms.
          # On Linux, .NET probes the app output dir first, where NuGet has placed the
          # Windows PE onnxruntime.dll. Override it with our ROCm ELF so the load succeeds.
          cp native-libs/libonnxruntime.so "$OUTPUT_DIR/onnxruntime.dll"
          cp native-libs/libonnxruntime.so "$OUTPUT_DIR/libonnxruntime.so"
          cp native-libs/libonnxruntime_providers_shared.so "$OUTPUT_DIR/libonnxruntime_providers_shared.so"
          # NOTE: do NOT copy libonnxruntime_providers_migraphx.so into the output dir.
          # The on-disk tests (structure/symbols/SONAME) reach it via NATIVE_LIBS_DIR
          # without loading it, keeping the suite independent of host ROCm state.
          # (Its presence in an app dir is harmless — ORT 1.24.x loads providers only
          # when the EP is requested — but the suite never needs it loaded.)
          echo "Native libs injected:"
          ls -lh "$OUTPUT_DIR/onnxruntime.dll" "$OUTPUT_DIR/libonnxruntime.so"

      - name: Run Tier-1 validation tests
        env:
          NATIVE_LIBS_DIR: ${{ github.workspace }}/native-libs
          EXPECTED_ORT_VERSION: "1.24.1"  # Must match ORT_TAG in scripts/compile_onnx_rocm_docker.sh (couplet invariant)
        run: |
          dotnet test InferenceEngine.Core.IntegrationTests/InferenceEngine.Core.IntegrationTests.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --no-build \
            --logger "console;verbosity=normal"

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: validate-native
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download NuGet Package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-package-rocm
          path: ./nupkg

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/intel-agency/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

  create-release:
    name: Create GitHub Release & Publish to NuGet.org
    needs: validate-native
    if: github.ref_name == 'release'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      # Fail before creating any public tag/release if the secret is missing —
      # otherwise a bad run would publish a release with no nuget.org package.
      - name: Verify required secrets
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not configured"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download NuGet Package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-package-rocm
          path: ./nupkg

      - name: Download Native Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-rocm-libs
          path: ./native-libs

      - name: Download Debug Info
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-rocm-debuginfo
          path: ./debuginfo

      - name: Compute Release Version
        run: |
          PREFIX="${{ vars.VERSION_PREFIX }}"
          RUN="${{ github.run_number }}"
          VERSION="${PREFIX}.${RUN}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Generate checksums
        run: |
          # One checksum per released asset (bare filenames so `sha256sum -c`
          # works in a flat download dir): stripped .so, split-DWARF .debug, .nupkg
          cd native-libs
          sha256sum *.so > SHA256SUMS.txt
          cd ../debuginfo
          sha256sum *.debug >> ../native-libs/SHA256SUMS.txt
          cd ../nupkg
          sha256sum *.nupkg >> ../native-libs/SHA256SUMS.txt
          echo "=== SHA256SUMS ==="
          cat ../native-libs/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: "v${{ env.VERSION }}"
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            native-libs/*.so
            native-libs/SHA256SUMS.txt
            debuginfo/*.debug
            nupkg/*.nupkg

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not configured"
            exit 1
          fi
          dotnet nuget push "./nupkg/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
